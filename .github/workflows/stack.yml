name: stack

on:
  pull_request:
    paths:
      - "ops/**"
      - "docker-compose*.yml"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/**"
      - "src/pgllens/obs/**"
      - ".github/workflows/stack.yml"
  push:
    branches: [main]
    # Same filter as the PR trigger: a push that touches none of these cannot
    # change what the stack layer proves.
    paths:
      - "ops/**"
      - "docker-compose*.yml"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/**"
      - "src/pgllens/obs/**"
      - ".github/workflows/stack.yml"
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC

permissions:
  contents: read

jobs:
  stack:
    # End-to-end proof of the observability stack (docs/OBSERVABILITY.md#proof-of-readiness).
    # Runs on PRs that touch the stack, on main, and weekly so image digest drift shows up.
    runs-on: ubuntu-latest
    timeout-minutes: 60  # chaos_alloy_down_alert alone budgets 1200s
    env:
      DATABASE_URL: postgresql://pgllens:pgllens-demo@demo-db:5432/demo
      EXPOSED_SCHEMAS: app_core,app_audit,app_custom
      GRAFANA_ADMIN_PASSWORD: ci-only
      MCP_AUTH_MODE: none
      PGLLENS_VERSION: ci
      # Linux runner, so the infra-tier exporters (node, cAdvisor, postgres) are
      # real here even though they are not on a Docker Desktop host.
      INFRA: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image compose will run
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/dmdufresne/pgllens:ci  # must match env.PGLLENS_VERSION (pinned by tests/test_ops_ci.py)
      - name: Stack layer
        timeout-minutes: 15
        run: scripts/verify-stack.sh --keep
      - name: Chaos layer
        # Schedule only: the chaos layer costs ~40 minutes, and a main push has
        # already had the stack layer run against it.
        if: github.event_name == 'schedule'
        timeout-minutes: 40
        run: scripts/verify-stack.sh --chaos --no-up
      - name: Logs on failure
        if: failure()
        run: docker compose --profile observe --profile infra -f docker-compose.yml -f ops/demo/docker-compose.yml logs --no-color --tail=200
