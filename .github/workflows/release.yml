name: release

# A `vX.Y.Z` tag publishes ghcr.io/dmdufresne/pgllens:X.Y.Z and :latest. The tag
# must match `version` in pyproject.toml, so the image and the package it carries
# never disagree (docs/DEPLOY.md#publishing-the-image).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match pyproject version
        run: grep -qx "version = \"${GITHUB_REF_NAME#v}\"" pyproject.toml || { echo "tag $GITHUB_REF_NAME != pyproject version"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dmdufresne/pgllens
          # latest=auto (the default flavor) adds :latest for non-prerelease semver tags.
          tags: type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # amd64 only: the build stage compiles nothing, but arm64 under QEMU is
          # unverified here. Add linux/arm64 with docker/setup-qemu-action once tried.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
