name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - run: uv run ruff check src tests
      - run: uv run mypy src
      # No PGLLENS_TEST_DSN / PGLLENS_TEST_REDIS_URL here: the integration suites
      # skip cleanly without them, by design.
      - run: uv run pytest

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pgllens:ci

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pgllens:ci
          format: table
          # Fail only on a CRITICAL that HAS a fix: an unfixable critical in a
          # base image cannot be actioned, and a build that fails on it just
          # trains everyone to ignore the scanner.
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate the SBOM
        uses: anchore/sbom-action@v0
        with:
          image: pgllens:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Publish the SBOM alongside the build
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
